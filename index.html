<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينمانا - Cinema</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #f5c518;
            --text-color: #ffffff;
            --text-secondary: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* الهيدر وشريط البحث */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background-color: #161b22;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        /* شبكة عرض الأفلام */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .movie-card:hover {
            transform: scale(1.03);
        }

        .movie-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .movie-info {
            padding: 8px;
        }

        .movie-title {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-rating {
            font-size: 0.75rem;
            color: var(--accent-color);
            margin-top: 4px;
        }

        /* مشغل الفيديو (Modal) */
        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .player-modal.active {
            display: flex;
        }

        .player-container {
            width: 95%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }

        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: -35px;
            left: 0;
            color: #fff;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* رسالة التحميل والخطأ */
        .status-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎬 سينمانا</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." onkeyup="handleSearch()">
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">أحدث العروض</h2>
        <div class="movies-grid" id="moviesContainer">
            <div class="status-msg">جاري تحميل المحتوى...</div>
        </div>
    </div>

    <!-- نافذة المشغل -->
    <div class="player-modal" id="playerModal">
        <div class="player-container">
            <button class="close-btn" onclick="closePlayer()">✕ إغلاق</button>
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // رابط سيرفرك الفعلي الصحيح
        const API_BASE_URL = 'https://my-server-production-19aa.up.railway.app';

        // 1. جلب قائمة الأفلام عند فتح الصفحة
        async function fetchMovies(query = '') {
            const container = document.getElementById('moviesContainer');
            
            try {
                const endpoint = query 
                    ? `${API_BASE_URL}/api/search?q=${encodeURIComponent(query)}`
                    : `${API_BASE_URL}/api/latest`;

                const res = await fetch(endpoint);
                if (!res.ok) throw new Error('تعذر الاتصال بالسيرفر');
                
                const movies = await res.json();
                renderMovies(movies);
            } catch (err) {
                container.innerHTML = `<div class="status-msg">⚠️ تعذر تحميل المحتوى، تأكد من الضغط على Deploy في Railway.</div>`;
            }
        }

        // 2. عرض البطاقات
        function renderMovies(movies) {
            const container = document.getElementById('moviesContainer');
            if (!movies || movies.length === 0) {
                container.innerHTML = `<div class="status-msg">لا توجد نتائج لعرضها.</div>`;
                return;
            }

            container.innerHTML = movies.map(movie => `
                <div class="movie-card" onclick="openPlayer('${movie.id}')">
                    <img src="${movie.poster || 'https://via.placeholder.com/150x220'}" alt="${movie.title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-rating">★ ${movie.rating || 'N/A'}</div>
                    </div>
                </div>
            `).join('');
        }

        // 3. البحث المقيد بوقفه زمنية
        let searchTimer;
        function handleSearch() {
            clearTimeout(searchTimer);
            const query = document.getElementById('searchInput').value.trim();
            searchTimer = setTimeout(() => fetchMovies(query), 500);
        }

        // 4. تشغيل الفيديو في المشغل
        function openPlayer(movieId) {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoIframe');
            
            iframe.src = `https://cee.buzz/player.html?id=${movieId}`;
            modal.classList.add('active');
        }

        // 5. إغلاق المشغل
        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoIframe');
            
            iframe.src = ''; 
            modal.classList.remove('active');
        }

        // التشغيل المبدئي
        fetchMovies();
    </script>
</body>
</html>
